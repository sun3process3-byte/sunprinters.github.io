*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  overflow:hidden;background:
    radial-gradient(circle at 12% 12%,rgba(237,28,43,.16),transparent 24%),
    radial-gradient(circle at 88% 88%,rgba(237,28,43,.12),transparent 25%),
    repeating-linear-gradient(135deg,rgba(237,28,43,.035) 0,rgba(237,28,43,.035) 2px,transparent 2px,transparent 22px),
    radial-gradient(circle,rgba(237,28,43,.08) 1.2px,transparent 1.7px),
    #fff;
  background-size:auto,auto,auto,20px 20px,auto;
}
.page{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px 18px}
.title{font-size:clamp(26px,6vw,42px);font-weight:800;color:#ed1c2b;margin:0 0 6px;text-align:center;letter-spacing:.2px}
.subtitle{font-size:12px;color:#777;margin:0 0 12px;text-align:center}
.wrap{width:min(420px,88vw);aspect-ratio:411/711;perspective:1800px}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;touch-action:none;cursor:grab;user-select:none}
.card:active{cursor:grabbing}
.face{
 position:absolute;inset:0;border-radius:28px;overflow:hidden;
 background-repeat:no-repeat;background-position:center;background-size:100% 100%;
 backface-visibility:hidden;-webkit-backface-visibility:hidden;
 box-shadow:0 28px 65px rgba(0,0,0,.28);border:1px solid rgba(0,0,0,.18)
}

<script>
const card=document.getElementById('card');
const stage=document.querySelector('.wrap');
let angle=0,auto=true,drag=false,lastX=0,moved=false,raf=0,downTarget=null;
function render(){card.style.transform='rotateY('+angle+'deg)'}
function tick(){
  if(!drag){angle=(angle+0.42)%360;render()}
  raf=requestAnimationFrame(tick)
}
tick();

stage.addEventListener('pointerdown',e=>{
  drag=true;lastX=e.clientX;moved=false;downTarget=e.target;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-lastX;
  if(Math.abs(dx)>1)moved=true;
  angle+=dx*0.72;
  lastX=e.clientX;render();
});
stage.addEventListener('pointerup',e=>{
  drag=false;
});
stage.addEventListener('pointercancel',()=>drag=false);

/* Let a genuine tap activate the transparent hotspot without changing it into a drag. */
document.querySelectorAll('.hotspot').forEach(link=>{
  link.addEventListener('pointerdown',e=>{e.stopPropagation()});
});
</script>
